name: tests
# All end-to-end tests (tests/README.md). Runs on every push / pull request that changes the app; can also be started by hand.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:i18n && npx tsc --noEmit
      - run: bash tests/run-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/out/*.log
            tests/out/summary.txt
            tests/out/work/*.png
